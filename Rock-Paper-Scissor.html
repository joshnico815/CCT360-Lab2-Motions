<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/Rock-Paper-Scissors.css">
</head>

<body>
    <p class="title">Rock Paper Scissors</p>

    <div class="move-buttons">
        <div class="move-options">
            <button onclick="
                playGame('rock');
            " class="move-button" id="move-rock"><img src="images/rock-emoji.png" class="move-icon" alt="Rock Hand Emoji">
            </button>
            <p>Rock</p>
        </div>

        <div class="move-options">
            <button onclick="
                playGame('paper');
            " class="move-button" id="move-paper"><img src="images/paper-emoji.png" class="move-icon" alt="Paper Hand Emoji">
            </button>
            <p>Paper</p>
        </div>

        <div class="move-options">
            <button onclick="
                playGame('scissors');
            " class="move-button" id="move-scissors"><img src="images/scissors-emoji.png" class="move-icon" alt="Scissors Hand Emoji">
            </button>
            <p>Scissors</p>
        </div>
    </div>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score" ></p>

    <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();
    document.querySelector('.js-result')
        .innerHTML = 'Score Reset';
    " class="reset-score-button">Reset Score</button>

    <script src="scripts/Rock-Paper-Scissors.js"></script>
    
</body>
</html>
